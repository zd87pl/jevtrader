name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e . ruff==0.15.9 mypy==1.20.1
      - run: ruff check .
      - run: ruff format --check .
      - name: mypy (fail on new errors)
        env:
          # Pre-existing errors in older modules; lower this as they are fixed.
          MYPY_BASELINE: 9
        run: |
          mypy jevtrader --ignore-missing-imports | tee mypy.log || true
          errors=$(grep -c ' error: ' mypy.log || true)
          echo "mypy errors: $errors (baseline $MYPY_BASELINE)"
          test "$errors" -le "$MYPY_BASELINE"

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11"
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      # The suite is offline and isolated (tests/conftest.py); the timeout dumps
      # stacks instead of letting a hung thread burn the job budget.
      - run: python -m pytest -q -o faulthandler_timeout=300

  package:
    name: Wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python -m pip install build
      - run: python -m build
      - name: Install the wheel into a clean venv and run the offline demo
        env:
          JEVTRADER_HOME: ${{ runner.temp }}/home
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/jevtrader" --help > /dev/null
          "$RUNNER_TEMP/venv/bin/jevtrader" --db "$RUNNER_TEMP/demo.sqlite" demo > demo.json
          "$RUNNER_TEMP/venv/bin/python" -c "import json; assert json.load(open('demo.json'))['mode'] == 'synthetic'"
