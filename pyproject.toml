[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevtrader"
version = "0.2.0"
description = "A small, auditable disclosure trading research lab"
readme = "README.md"
authors = [{ name = "Zygmunt Dyras" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
jevtrader = "jevtrader.cli:main"

[tool.setuptools.packages.find]
include = ["jevtrader*"]

[tool.setuptools.package-data]
jevtrader = ["default_strategy.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

