version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # Python: pyproject.toml ranges and the exact CI pins in
  # requirements/test-constraints.txt.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
